<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In · Nexus</title>

    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ───── Reset & Base ───── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        /* ───── Container ───── */
        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes floatUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 2.5rem;
            padding: 2.5rem 2.2rem 2.8rem;
            box-shadow:
                0 30px 60px -20px rgba(0, 20, 40, 0.25),
                0 8px 24px -6px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: box-shadow 0.3s ease;
        }

        .auth-card:hover {
            box-shadow:
                0 40px 80px -20px rgba(0, 20, 40, 0.30),
                0 8px 28px -6px rgba(0, 0, 0, 0.08);
        }

        /* ───── Header ───── */
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            box-shadow: 0 8px 16px -6px rgba(37, 99, 235, 0.30);
            transition: transform 0.2s ease;
        }

        .brand-icon:hover {
            transform: scale(1.04) rotate(-2deg);
        }

        .brand h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b1e33, #1e3a5f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subhead {
            font-size: 0.95rem;
            color: #4b5b6e;
            margin-top: -0.1rem;
            margin-bottom: 1.8rem;
            font-weight: 450;
            letter-spacing: -0.01em;
        }

        .subhead span {
            color: #2563eb;
            font-weight: 600;
        }

        /* ───── Form ───── */
        .form-group {
            margin-bottom: 1.4rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #1e2a44;
            letter-spacing: 0.02em;
            margin-bottom: 0.4rem;
            transition: color 0.2s;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .input-wrap:focus-within {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10), inset 0 2px 4px rgba(0, 0, 0, 0.01);
        }

        .input-wrap .icon-left {
            padding: 0 0 0 1rem;
            color: #8a9bb0;
            font-size: 1rem;
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .input-wrap:focus-within .icon-left {
            color: #2563eb;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 0.7rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 450;
            color: #0b1e33;
            outline: none;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
        }

        .input-wrap input::placeholder {
            color: #b0c0d0;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .input-wrap .toggle-pass {
            padding-right: 1rem;
            color: #8a9bb0;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s ease;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
        }

        .input-wrap .toggle-pass:hover {
            color: #1e2a44;
        }

        /* error state */
        .input-wrap.error {
            border-color: #dc2626;
            background: #fff5f5;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
        }

        .input-wrap.error .icon-left {
            color: #dc2626;
        }

        .error-msg {
            font-size: 0.78rem;
            color: #dc2626;
            font-weight: 500;
            margin-top: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            animation: shake 0.4s ease;
            min-height: 1.4rem;
        }

        .error-msg i {
            font-size: 0.7rem;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        /* ───── Options ───── */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.4rem 0 1.6rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: #2d4058;
            cursor: pointer;
            font-weight: 450;
        }

        .remember-me input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #2563eb;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .remember-me input[type="checkbox"]:hover {
            transform: scale(1.08);
        }

        .forgot-link {
            font-size: 0.88rem;
            color: #2563eb;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease, transform 0.15s ease;
            display: inline-block;
        }

        .forgot-link:hover {
            color: #1d4ed8;
            transform: translateX(2px);
        }

        /* ───── Button ───── */
        .btn-signin {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #2563eb, #6d28d9);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease;
            box-shadow: 0 12px 28px -10px rgba(37, 99, 235, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            letter-spacing: 0.01em;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-signin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -12px rgba(37, 99, 235, 0.45);
        }

        .btn-signin:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-signin:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-signin .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-signin.loading .spinner {
            display: block;
        }

        .btn-signin.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ───── Footer ───── */
        .auth-footer {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.92rem;
            color: #4b5b6e;
        }

        .auth-footer a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* ───── Dashboard (hidden initially) ───── */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 2.5rem;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-align: center;
        }

        .dashboard.active {
            display: block;
        }

        .dashboard .brand {
            justify-content: center;
        }

        .dashboard h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b1e33;
            margin: 1.2rem 0 0.4rem;
        }

        .dashboard p {
            color: #4b5b6e;
            font-size: 1.05rem;
            max-width: 380px;
            margin: 0 auto 1.8rem;
        }

        .dashboard .badge {
            display: inline-block;
            background: #e6f0ff;
            color: #2563eb;
            font-weight: 600;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }

        .dashboard .btn-signout {
            background: transparent;
            border: 1.5px solid #d0dce8;
            padding: 0.7rem 2.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e2a44;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 1rem;
        }

        .dashboard .btn-signout:hover {
            background: #f0f4fe;
            border-color: #2563eb;
            color: #2563eb;
            transform: translateY(-2px);
        }

        .dashboard .user-email {
            font-weight: 500;
            color: #1e3a5f;
            background: rgba(37, 99, 235, 0.06);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.9rem;
        }

        /* ───── Responsive ───── */
        @media (max-width: 520px) {
            .auth-card {
                padding: 1.8rem 1.4rem 2rem;
                border-radius: 1.8rem;
            }

            .brand h1 {
                font-size: 1.4rem;
            }

            .brand-icon {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }

            .input-wrap input {
                font-size: 0.95rem;
                padding: 0.8rem 0.8rem 0.8rem 0.4rem;
            }

            .input-wrap .icon-left {
                padding-left: 0.8rem;
            }

            .btn-signin {
                font-size: 0.95rem;
                padding: 0.85rem;
            }

            .options-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }

            .dashboard {
                padding: 2rem 1.4rem;
            }

            .dashboard h2 {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 380px) {
            .auth-card {
                padding: 1.4rem 1rem 1.6rem;
            }

            .brand h1 {
                font-size: 1.2rem;
            }

            .subhead {
                font-size: 0.85rem;
            }
        }

        /* ───── Utilities ───── */
        .hidden {
            display: none !important;
        }

        .mt-1 {
            margin-top: 0.25rem;
        }

        /* ripple effect on button */
        .btn-signin .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #f1f5f9;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.92rem;
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 1rem;
        }

        .toast.success i {
            color: #4ade80;
        }
        .toast.error i {
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- ─── SIGN-IN CARD ─── -->
    <div class="auth-wrapper" id="authWrapper">
        <div class="auth-card" id="authCard">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-bolt"></i></div>
                <h1>Sign In</h1>
            </div>
            <p class="subhead">Welcome back · sign in to your <span>dashboard</span></p>

            <!-- Form -->
            <form id="signinForm" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label for="email"><i class="far fa-envelope" style="margin-right:6px;color:#6b7f94;"></i> Email</label>
                    <div class="input-wrap" id="emailWrap">
                        <span class="icon-left"><i class="far fa-envelope"></i></span>
                        <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        value="demo@nexus.com"
                        required
                        />
                    </div>
                    <div class="error-msg" id="emailError"></div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock" style="margin-right:6px;color:#6b7f94;"></i> Password</label>
                    <div class="input-wrap" id="passWrap">
                        <span class="icon-left"><i class="fas fa-lock"></i></span>
                        <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        value="demo123"
                        required
                        />
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password visibility">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="error-msg" id="passError"></div>
                </div>

                <!-- Options -->
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" checked />
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-signin" id="signinBtn">
                    <span class="spinner"></span>
                    <span class="btn-text"><i class="fas fa-arrow-right-to-bracket" style="margin-right:8px;"></i>Sign In</span>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="#" onclick="window.location.href='sign-up.html'">Create one</a>
            </div>
        </div>
    </div>

    <!-- ─── DASHBOARD ─── -->
    <div class="dashboard" id="dashboard">
        <div class="brand" style="justify-content:center;">
            <div class="brand-icon"><i class="fas fa-bolt"></i></div>
            <h1>Nexus</h1>
        </div>
        <div class="badge"><i class="fas fa-check-circle" style="margin-right:6px;"></i>Signed in</div>
        <h2>Welcome back, <span id="dashUser">User</span> 👋</h2>
        <p>You've successfully signed in. Your dashboard is ready to go.</p>
        <div class="user-email" id="dashEmail">demo@nexus.com</div>
        <br />
        <button class="btn-signout" id="signoutBtn"><i class="fas fa-sign-out-alt" style="margin-right:8px;"></i>Sign Out</button>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast">
        <i class="fas fa-circle-check"></i>
        <span id="toastMsg">Success</span>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const authWrapper = document.getElementById('authWrapper');
            const authCard = document.getElementById('authCard');
            const dashboard = document.getElementById('dashboard');

            const form = document.getElementById('signinForm');
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            const emailWrap = document.getElementById('emailWrap');
            const passWrap = document.getElementById('passWrap');
            const emailError = document.getElementById('emailError');
            const passError = document.getElementById('passError');
            const signinBtn = document.getElementById('signinBtn');
            const togglePass = document.getElementById('togglePass');
            const toggleIcon = document.getElementById('toggleIcon');
            const rememberCheck = document.getElementById('remember');

            const dashUser = document.getElementById('dashUser');
            const dashEmail = document.getElementById('dashEmail');
            const signoutBtn = document.getElementById('signoutBtn');

            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            // ─── State ───
            let isSubmitting = false;

            // ─── Helpers ───
            function showToast(message, type = 'success') {
                const icon = toast.querySelector('i');
                if (type === 'success') {
                    icon.className = 'fas fa-circle-check';
                    toast.className = 'toast success show';
                } else {
                    icon.className = 'fas fa-circle-exclamation';
                    toast.className = 'toast error show';
                }
                toastMsg.textContent = message;
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3800);
            }

            function clearErrors() {
                emailWrap.classList.remove('error');
                passWrap.classList.remove('error');
                emailError.innerHTML = '';
                passError.innerHTML = '';
            }

            function setFieldError(wrap, errorEl, message) {
                wrap.classList.add('error');
                errorEl.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${message}`;
            }

            function setLoading(state) {
                isSubmitting = state;
                signinBtn.disabled = state;
                signinBtn.classList.toggle('loading', state);
            }

            // ─── Toggle password ───
            togglePass.addEventListener('click', function() {
                const type = passInput.type === 'password' ? 'text' : 'password';
                passInput.type = type;
                toggleIcon.className = type === 'password' ? 'far fa-eye' : 'far fa-eye-slash';
            });

            // ─── Live clear error on focus ───
            emailInput.addEventListener('focus', () => {
                emailWrap.classList.remove('error');
                emailError.innerHTML = '';
            });
            passInput.addEventListener('focus', () => {
                passWrap.classList.remove('error');
                passError.innerHTML = '';
            });

            // ─── Validate single field ───
            function validateEmail() {
                const val = emailInput.value.trim();
                if (!val) {
                    setFieldError(emailWrap, emailError, 'Email is required');
                    return false;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
                    setFieldError(emailWrap, emailError, 'Please enter a valid email address');
                    return false;
                }
                emailWrap.classList.remove('error');
                emailError.innerHTML = '';
                return true;
            }

            function validatePassword() {
                const val = passInput.value;
                if (!val) {
                    setFieldError(passWrap, passError, 'Password is required');
                    return false;
                }
                if (val.length < 4) {
                    setFieldError(passWrap, passError, 'Password must be at least 4 characters');
                    return false;
                }
                passWrap.classList.remove('error');
                passError.innerHTML = '';
                return true;
            }

            // ─── Submit handler ───
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearErrors();

                // Validate both
                const isEmailValid = validateEmail();
                const isPassValid = validatePassword();

                if (!isEmailValid || !isPassValid) {
                    // focus first invalid
                    if (!isEmailValid) emailInput.focus();
                    else if (!isPassValid) passInput.focus();
                    return;
                }

                const email = emailInput.value.trim();
                const password = passInput.value;

                setLoading(true);

                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 1200));

                try {
                    const result = await loginUser(email, password, rememberCheck.checked);
                    setLoading(false);
                    if (result.success) {
                        showToast(`Welcome back, ${result.data.user.name || email.split('@')[0]}!`, 'success');
                        const role = getUserRole();
                        if (role === 'ADMIN') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'employee-dashboard.html';
                        }
                    } else {
                        setFieldError(emailWrap, emailError, ' ');
                        setFieldError(passWrap, passError, ' ');
                        emailError.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${result.message || 'Invalid credentials'}`;
                        passError.innerHTML = `<i class="fas fa-circle-exclamation"></i> Please try again`;
                        emailWrap.classList.add('error');
                        passWrap.classList.add('error');
                        showToast(result.message || 'Invalid credentials', 'error');
                    }
                } catch (err) {
                    setLoading(false);
                    setFieldError(emailWrap, emailError, ' ');
                    setFieldError(passWrap, passError, ' ');
                    emailError.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${err.message || 'Login failed'}`;
                    passError.innerHTML = `<i class="fas fa-circle-exclamation"></i> Please try again`;
                    emailWrap.classList.add('error');
                    passWrap.classList.add('error');
                    showToast(err.message || 'Login failed', 'error');
                }
            });

            // ─── Sign Out ───
            signoutBtn.addEventListener('click', function() {
                dashboard.classList.remove('active');
                authWrapper.style.display = 'block';
                // Reset form
                form.reset();
                clearErrors();
                // set default demo values
                emailInput.value = 'demo@nexus.com';
                passInput.value = 'demo123';
                // Reset password toggle icon
                if (passInput.type !== 'password') {
                    passInput.type = 'password';
                    toggleIcon.className = 'far fa-eye';
                }
                showToast('Signed out successfully.', 'success');
                // focus email
                setTimeout(() => emailInput.focus(), 300);
            });

            // ─── Remember me on load ───
            (function init() {
                const remembered = localStorage.getItem('nexus_remember');
                if (remembered) {
                    emailInput.value = remembered;
                    rememberCheck.checked = true;
                    // Auto-focus password if email is filled
                    if (remembered) passInput.focus();
                }
            })();

            // ─── Ripple effect on button ───
            signinBtn.addEventListener('click', function(e) {
                if (this.disabled) return;
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                ripple.className = 'ripple';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });

            // ─── Keyboard shortcut: Ctrl+Enter to submit ───
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    if (authWrapper.style.display !== 'none') {
                        form.dispatchEvent(new Event('submit'));
                    }
                }
            });

            console.log('🔐 Nexus Sign-In ready. Use demo@nexus.com / demo123');
        })();
    </script>

</body>
</html>
